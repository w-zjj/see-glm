# see-glm Agent 配置
# 适配 Codex / zcode Agent 框架（遵循 agentskills.io 开放标准）
# 跨平台: Windows / macOS / Linux
name: see-glm
description: 通过 GLM-4.1V-Thinking-Flash 查看和分析图片 (跨平台)

# 触发关键词
triggers:
  - 看看
  - 查看
  - 识别
  - 分析.*图
  - 截图
  - 比较.*图
  - 描述.*图
  - .png
  - .jpg
  - .jpeg
  - .webp
  - .bmp
  - screenshot
  - image

# 允许的文件扩展名
allowed_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .webp
  - .bmp

# 脚本路径（相对于 Skill 根目录）
scripts:
  main: scripts/see.py
  onboard: scripts/onboard.py
  parse_media: scripts/parse_media.py

# 默认配置
defaults:
  model: GLM-4.1V-Thinking-Flash
  jobs: 3
  temperature: 0.1
  max_tokens: 8192
